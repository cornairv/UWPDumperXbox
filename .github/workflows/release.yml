name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build
        run: msbuild /m /restore /p:Configuration=Release /p:Platform=x64

      - name: Publish
        run: dotnet publish UploadServer --configuration Release

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          UWPDumperXbox/bin/Release/netstandard2.0/UWPDumperXbox.xml
          UploadServer/bin/Release/net10.0/win-x64/publish/UploadServer.exe